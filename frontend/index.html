<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egnex — One Click Hire</title>
<style>
:root {
  --accent:#f15a22; --sidebar:#0c0d10; --page:#faf9f6;
  --card:#ffffff;   --green:#1d6e56;   --border:#e5e3df;
  --text:#1a1d24;   --muted:#6b6760;   --gold:#b08423;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--page);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px}

/* ── Sidebar ── */
#sidebar{width:200px;min-width:200px;background:var(--sidebar);display:flex;flex-direction:column;overflow-y:auto}
#sidebar .logo-area{padding:20px 16px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
#sidebar .logo-area img{height:36px;width:auto;display:block}
#sidebar nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#c0bfbd;cursor:pointer;border-left:3px solid transparent;font-size:13px;transition:background .12s,color .12s;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{border-left-color:var(--accent);background:rgba(241,90,34,.15);color:#fff;font-weight:500}
.nav-icon{font-size:15px;opacity:.7;width:18px;text-align:center}
.nav-sep{height:1px;background:rgba(255,255,255,.06);margin:6px 16px}

/* ── Main area ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0}
#topbar .screen-title{font-weight:600;font-size:16px;flex:1}
#topbar .gcal-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gcal-dot{width:7px;height:7px;border-radius:50%;background:#ccc}
.gcal-dot.on{background:var(--green)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;cursor:pointer}
.user-menu{position:relative;display:flex;align-items:center;gap:8px}
.user-menu .name{font-size:13px;color:var(--muted)}
#content{flex:1;overflow-y:auto;padding:28px 32px;background:var(--page)}

/* ── Cards ── */
.card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:20px}
.card-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* ── Pipeline stage cards ── */
.stage-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.stage-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:14px 10px;text-align:center;flex:1;min-width:72px}
.stage-card .n{font-size:26px;font-weight:700;line-height:1.1}
.stage-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:3px;line-height:1.3}
.stage-card.joined .n{color:var(--green)}
.stage-card.ath{border-left:3px solid var(--accent)}
.stage-card.ath .n{color:var(--accent);font-size:22px}

/* ── Table ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f5}
.clickable-row{cursor:pointer}

/* ── Pills / badges ── */
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.pill.open{background:#dff0eb;color:var(--green)}
.pill.closed,.pill.cancelled{background:#f0ece4;color:var(--muted)}
.pill.on_hold{background:#f3e9d0;color:var(--gold)}
.pill.draft{background:#ede9e2;color:#888}
.pill.applied,.pill.screening{background:#ede9e2;color:#888}
.pill.screen_passed{background:#dff0eb;color:var(--green)}
.pill.interviewing{background:#fdeedd;color:var(--gold)}
.pill.selected{background:#dff0eb;color:var(--green);font-weight:700}
.pill.offer_stage,.pill.offered{background:#e6f0fb;color:#2563eb}
.pill.joined{background:#dff0eb;color:var(--green)}
.pill.rejected,.pill.screen_rejected,.pill.dropped{background:#fde8e4;color:#8b2a1a}
.role-pill{padding:2px 8px;border-radius:10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.role-pill.recruiter{background:#dff0eb;color:var(--green)}
.role-pill.ta_manager{background:#f3e9d0;color:var(--gold)}
.role-pill.admin{background:#fde8e4;color:#8b2a1a}
.role-pill.hiring_manager{background:#e6f0fb;color:#2563eb}
.role-pill.other{background:#ede9e2;color:#888}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:4px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:500;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#d14d1e}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:transparent;color:#c0392b;border:1px solid #c0392b}
.btn-danger:hover{background:#c0392b;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Forms ── */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;background:#fff;outline:none;transition:border-color .12s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}

/* ── Kanban ── */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;min-height:400px}
.kb-col{min-width:200px;max-width:220px;flex-shrink:0;display:flex;flex-direction:column}
.kb-col-head{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:6px 4px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);margin-bottom:8px}
.kb-col-head span.cnt{background:var(--border);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600}
.kb-col-body{flex:1;min-height:80px;border-radius:4px;padding:4px;transition:background .12s}
.kb-col-body.drag-over{background:rgba(241,90,34,.06);border:1px dashed var(--accent)}
.kb-card{background:#fff;border:1px solid var(--border);border-radius:5px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:box-shadow .12s;-webkit-user-select:none;user-select:none}
.kb-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kb-card:active{cursor:grabbing}
.kb-card.dragging{opacity:.4;-webkit-user-select:none;user-select:none}
.kb-card .name{font-weight:600;font-size:13px;margin-bottom:3px}
.kb-card .score{font-size:12px;color:var(--muted)}
.kb-card .gender{font-size:11px;color:var(--muted)}

/* ── Diversity bar ── */
.div-bar-wrap{margin:10px 0 4px}
.div-bar{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--border)}
.div-bar .seg{display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:500;transition:width .3s}
.div-bar .seg.female{background:var(--accent)}
.div-bar .seg.male{background:#2563eb}
.div-bar .seg.unk{background:var(--muted)}
.div-legend{display:flex;gap:16px;margin-top:6px}
.div-legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Misc ── */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.page-header h1{font-size:20px;font-weight:600;flex:1}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.flash{position:fixed;top:0;left:0;right:0;padding:12px 24px;color:#fff;font-size:14px;z-index:9999;text-align:center}
.flash-ok{background:var(--green)}
.flash-err{background:var(--accent)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border:1px solid var(--border);border-radius:6px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h2{font-size:17px;font-weight:600;margin-bottom:18px}
.modal-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:6px 14px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:13px;background:#fff}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.inline-btns{display:flex;gap:6px;flex-wrap:wrap}
.score-big{font-size:28px;font-weight:700;color:var(--accent)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.section{margin-bottom:28px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.two-col{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo-area">
    <img src="/assets/egnex-logo.png" alt="Egnex">
  </div>
  <nav id="sidenav"></nav>
</div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div class="screen-title" id="topbar-title">Dashboard</div>
    <div class="gcal-status" id="gcal-indicator">
      <span class="gcal-dot" id="gcal-dot"></span>
      <span id="gcal-text">Calendar</span>
    </div>
    <div class="user-menu">
      <span class="name" id="topbar-name"></span>
      <div class="avatar" id="topbar-avatar" title="Sign out" onclick="logout()"></div>
    </div>
  </div>
  <div id="content"><p class="empty">Loading…</p></div>
</div>

<!-- NEW REQUISITION MODAL -->
<div class="modal-bg" id="req-modal" onclick="if(event.target===this)closeReqModal()">
  <div class="modal">
    <h2>New requisition</h2>
    <div class="form-row">
      <div class="form-group"><label>Job title</label><input id="rf-title" placeholder="e.g. Backend Engineer"></div>
      <div class="form-group"><label>Fiscal year</label><input id="rf-fy" placeholder="FY25-26"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Business unit</label><select id="rf-bu"></select></div>
      <div class="form-group"><label>Band</label><select id="rf-band"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Roll type</label>
        <select id="rf-roll"><option value="on_roll">On-roll</option><option value="off_roll">Off-roll</option></select>
      </div>
      <div class="form-group"><label>Openings</label><input id="rf-openings" type="number" value="1" min="1"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Min experience (years)</label><input id="rf-exp" type="number" placeholder="3"></div>
      <div class="form-group"><label>Budgeted CTC (₹)</label><input id="rf-ctc" type="number" placeholder="1800000"></div>
    </div>
    <div class="form-group"><label>Key skills (comma separated)</label><input id="rf-skills" placeholder="Python, PostgreSQL, GCP"></div>
    <div class="form-group"><label>Job description</label><textarea id="rf-jd" rows="3" placeholder="Role overview…"></textarea></div>

    <div style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px">Panel levels</div>
      <div id="rounds-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px"></div>
      <button class="btn btn-ghost btn-sm" type="button" onclick="addRound()">+ Add level</button>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeReqModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitReq()">Create requisition</button>
    </div>
  </div>
</div>

<!-- APPLY MODAL -->
<div class="modal-bg" id="apply-modal" onclick="if(event.target===this)closeApplyModal()">
  <div class="modal">
    <h2>Submit application</h2>
    <div class="form-group"><label>Requisition</label><select id="am-req"></select></div>
    <div class="form-row">
      <div class="form-group"><label>Candidate name</label><input id="am-name" placeholder="Priya Sharma"></div>
      <div class="form-group"><label>Email</label><input id="am-email" type="email" placeholder="priya@example.com"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Gender</label>
        <select id="am-gender"><option value="female">Female</option><option value="male">Male</option><option value="undisclosed">Undisclosed</option></select>
      </div>
      <div class="form-group"><label>Years of experience</label><input id="am-years" type="number" placeholder="4"></div>
    </div>
    <div class="tabs">
      <div class="tab active" id="am-tab-file" onclick="setApplyMode('file')">Upload resume</div>
      <div class="tab" id="am-tab-text" onclick="setApplyMode('text')">Paste text</div>
    </div>
    <div id="am-file-area" class="form-group">
      <label>Resume file (PDF or Word)</label>
      <input id="am-file" type="file" accept=".pdf,.docx,.doc" style="padding:6px;cursor:pointer">
    </div>
    <div id="am-text-area" class="form-group" style="display:none">
      <label>Resume text</label>
      <textarea id="am-text" rows="4" placeholder="Python, PostgreSQL, REST API…"></textarea>
    </div>
    <div id="am-result" style="display:none;margin-top:12px;padding:14px;background:#faf9f6;border-radius:4px;border:1px solid var(--border)"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeApplyModal()">Close</button>
      <button class="btn btn-primary" id="am-submit-btn" onclick="submitApply()">Submit &amp; screen</button>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal-bg" id="chpw-modal" onclick="if(event.target===this)document.getElementById('chpw-modal').classList.remove('open')">
  <div class="modal" style="max-width:360px">
    <h2>Change password</h2>
    <div class="form-group"><label>Current password</label><input id="chpw-old" type="password"></div>
    <div class="form-group"><label>New password</label><input id="chpw-new" type="password"></div>
    <p id="chpw-err" style="color:#c0392b;font-size:13px;margin-top:6px;display:none"></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="document.getElementById('chpw-modal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="doChpw()">Update</button>
    </div>
  </div>
</div>

<!-- RESET PW MODAL (admin) -->
<div class="modal-bg" id="reset-modal" onclick="if(event.target===this)closeResetModal()">
  <div class="modal" style="max-width:340px">
    <h2>Reset password</h2>
    <p id="reset-for" style="font-size:13px;color:var(--muted);margin-bottom:10px"></p>
    <div class="form-group"><label>New password</label><input id="reset-pw" type="password"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeResetModal()">Cancel</button>
      <button class="btn btn-primary" onclick="doReset()">Set password</button>
    </div>
  </div>
</div>

<script>
// ── Auth bootstrap ────────────────────────────────────────────────────────────
const _tok = localStorage.getItem('egnex_token');
if (!_tok) { window.location.replace('/login'); throw ''; }
function _jwt(t) {
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch { return null; }
}
const ME = _jwt(_tok);
if (!ME) { localStorage.removeItem('egnex_token'); window.location.replace('/login'); throw ''; }

// ── API helper ────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  opts.headers = { ...opts.headers, Authorization: `Bearer ${_tok}` };
  let r;
  try { r = await fetch(path, opts); }
  catch (e) {
    console.error('Network error:', path, e);
    flash('Network error — server may still be starting up. Retrying…', false);
    // auto-retry once after 2 s
    await new Promise(res => setTimeout(res, 2000));
    try { r = await fetch(path, opts); }
    catch (e2) { flash('Server unreachable. Is Docker running?', false); return null; }
  }
  if (r.status === 401) { logout(); return null; }
  if (!r.ok) {
    let detail = `HTTP ${r.status}`;
    try { const j = await r.clone().json(); detail = j.detail || JSON.stringify(j); } catch {}
    console.error('API error:', path, detail);
    return null;
  }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) return null;
  return r.json();
}

function flash(msg, ok = true) {
  const el = document.createElement('div');
  el.className = `flash ${ok ? 'flash-ok' : 'flash-err'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function logout() { localStorage.removeItem('egnex_token'); window.location.replace('/login'); }

// ── Shell ─────────────────────────────────────────────────────────────────────
const NAV_DEF = {
  recruiter:      [{id:'dashboard',icon:'⬛',label:'Dashboard'},{id:'requisitions',icon:'📋',label:'Requisitions'},{id:'candidates',icon:'👤',label:'Candidates'},{id:'interviews',icon:'📅',label:'Interviews'},{id:'reports',icon:'📊',label:'Reports'}],
  ta_manager:     [{id:'dashboard',icon:'⬛',label:'Dashboard'},{id:'requisitions',icon:'📋',label:'Requisitions'},{id:'candidates',icon:'👤',label:'Candidates'},{id:'interviews',icon:'📅',label:'Interviews'},{id:'reports',icon:'📊',label:'Reports'},{id:'sep'},{id:'team',icon:'👥',label:'Team'},{id:'analytics',icon:'📈',label:'Analytics'}],
  admin:          [{id:'dashboard',icon:'⬛',label:'Dashboard'},{id:'requisitions',icon:'📋',label:'Requisitions'},{id:'candidates',icon:'👤',label:'Candidates'},{id:'interviews',icon:'📅',label:'Interviews'},{id:'reports',icon:'📊',label:'Reports'},{id:'sep'},{id:'team',icon:'👥',label:'Team'}],
  hiring_manager: [{id:'dashboard',icon:'⬛',label:'Dashboard'},{id:'profiles',icon:'✅',label:'Profiles to review'},{id:'interviews',icon:'📅',label:'Interviews'}],
};

function buildNav() {
  const role = ME.role || 'recruiter';
  const items = NAV_DEF[role] || NAV_DEF.recruiter;
  const nav = document.getElementById('sidenav');
  nav.innerHTML = items.map(it => {
    if (it.id === 'sep') return '<div class="nav-sep"></div>';
    return `<div class="nav-item" id="nav-${it.id}" onclick="navigate('${it.id}')">
      <span class="nav-icon">${it.icon}</span>${it.label}
    </div>`;
  }).join('') + `
    <div style="flex:1"></div>
    <div class="nav-sep"></div>
    <div class="nav-item" onclick="document.getElementById('chpw-modal').classList.add('open');document.getElementById('chpw-old').value='';document.getElementById('chpw-new').value='';document.getElementById('chpw-err').style.display='none'">
      <span class="nav-icon">🔑</span>Change password
    </div>
    <div class="nav-item" onclick="logout()" style="color:#f87171">
      <span class="nav-icon">🚪</span>Sign out
    </div>`;

  // Topbar
  document.getElementById('topbar-name').textContent = ME.name;
  const initials = (ME.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('topbar-avatar').textContent = initials;
  document.getElementById('topbar-avatar').title = ME.name;
}

function setActive(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`nav-${id}`);
  if (el) el.classList.add('active');
}

function setTitle(t) { document.getElementById('topbar-title').textContent = t; }

// ── Router ────────────────────────────────────────────────────────────────────
const SCREENS = {
  dashboard:    screenDashboard,
  requisitions: screenRequisitions,
  candidates:   screenCandidates,
  interviews:   screenInterviews,
  reports:      screenReports,
  team:         screenTeam,
  analytics:    screenAnalytics,
  profiles:     screenProfiles,
};

function navigate(id, param) {
  const hash = param ? `#${id}/${param}` : `#${id}`;
  history.pushState({}, '', hash);
  runRoute(id, param);
}

function runRoute(id, param) {
  setActive(id);
  const content = document.getElementById('content');
  content.innerHTML = '<p class="empty">Loading…</p>';
  if (id === 'kanban' && param) { setTitle('Kanban board'); screenKanban(param); return; }
  const fn = SCREENS[id];
  if (fn) fn();
  else content.innerHTML = '<p class="empty">Screen not found.</p>';
}

window.addEventListener('popstate', () => {
  const [, id, param] = (location.hash || '#dashboard').split(/[#\/]/);
  runRoute(id || 'dashboard', param);
});

// ── GCal status in topbar ─────────────────────────────────────────────────────
let _gcalRid = localStorage.getItem('egnex_recruiter_id') || ME.sub;

async function refreshGCalStatus() {
  if (!_gcalRid) return;
  const d = await api(`/api/google/status?recruiter_id=${_gcalRid}`);
  if (!d) return;

// ── SCREEN: Kanban ────────────────────────────────────────────────────────────
let _kanbanReqId = null;

async function screenKanban(reqId) {
  _kanbanReqId = reqId;
  setActive('requisitions');

  const [detail, kb] = await Promise.all([
    api(`/api/requisitions/${reqId}/detail`),
    api(`/api/requisitions/${reqId}/kanban`),
  ]);
  if (!kb) return;

  const title = detail?.title || 'Requisition';
  setTitle(title);

  // Build column definitions
  const fixedLeft = [
    { status: 'applied',      label: 'Applications' },
    { status: 'screening',    label: 'Screening' },
    { status: 'screen_passed',label: 'Screening cleared' },
  ];
  const panelCols = (kb.rounds||[])
    .filter(r => !r.is_auto)
    .map(r => ({ status: 'interviewing', label: r.name, round_seq: r.sequence }));
  const fixedRight = [
    { status: 'selected',    label: 'Selected' },
    { status: 'offer_stage', label: 'Offer stage' },
    { status: 'joined',      label: 'Joined' },
  ];
  const cols = [...fixedLeft, ...panelCols, ...fixedRight];

  // Group candidates into columns
  function cardsFor(col) {
    return (kb.candidates||[]).filter(c => {
      if (c.status !== col.status) return false;
      if (col.round_seq !== undefined && c.current_round !== col.round_seq) return false;
      if (col.status === 'interviewing' && col.round_seq === undefined) return false;
      return true;
    });
  }

  const colsHtml = cols.map((col, i) => {
    const cards = cardsFor(col);
    const cardHtml = cards.map(c => `
      <div class="kb-card" draggable="true"
        data-app-id="${c.app_id}" data-status="${c.status}"
        ondragstart="kbDragStart(event)" ondragend="kbDragEnd(event)">
        <div class="name">${c.full_name}</div>
        <div class="score">Score: ${c.score!=null?Math.round(c.score):'—'}</div>
        <div class="gender">${c.gender||'—'}</div>
      </div>`).join('');
    return `
      <div class="kb-col">
        <div class="kb-col-head">
          <span>${col.label}</span>
          <span class="cnt">${cards.length}</span>
        </div>
        <div class="kb-col-body" data-col-index="${i}" data-status="${col.status}"
          ondragover="kbDragOver(event)" ondrop="kbDrop(event,this,'${col.status}',${col.round_seq||0})"
          ondragleave="kbDragLeave(event)">
          ${cardHtml}
        </div>
      </div>`;
  }).join('');

  const canApply = ['recruiter','ta_manager','admin'].includes(ME.role);

  document.getElementById('content').innerHTML = `
    <div class="page-header">
      <h1>${title}</h1>
      <button class="btn btn-ghost btn-sm" onclick="navigate('requisitions')">← All requisitions</button>
      ${canApply ? `<button class="btn btn-primary" onclick="openApplyModal('${reqId}')">+ Submit application</button>` : ''}
    </div>
    <div class="kanban">${colsHtml}</div>`;
}

// ── Kanban drag-and-drop ──────────────────────────────────────────────────────
let _dragAppId = null;

function kbDragStart(e) {
  _dragAppId = e.currentTarget.dataset.appId;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function kbDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function kbDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function kbDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function kbDrop(e, col, toStatus, roundSeq) {
  e.preventDefault();
  col.classList.remove('drag-over');
  if (!_dragAppId) return;
  const appId = _dragAppId; _dragAppId = null;
  const res = await api(`/api/applications/${appId}/advance`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to_status: toStatus, actor_id: ME.sub, note: `moved to ${toStatus}` }),
  });
  if (res) { flash(`Moved to ${toStatus}`); screenKanban(_kanbanReqId); }
}

function openAddUser() {
  document.getElementById('add-user-card').style.display = 'block';
  ['nu-name','nu-email','nu-pw'].forEach(id=>document.getElementById(id).value='');
}

async function createUser() {
  const name=document.getElementById('nu-name').value.trim(), email=document.getElementById('nu-email').value.trim();
  const role=document.getElementById('nu-role').value, pw=document.getElementById('nu-pw').value;
  if(!name||!email||!pw){flash('Fill in all fields.',false);return;}
  const res=await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:name,email,role,password:pw})});
  if(!res||res.detail||res.error){flash(res?.detail||res?.error||'Error',false);return;}
  flash(`User ${name} created.`); screenTeam();
}

async function changeRole(uid,role) {
  const res=await api(`/api/admin/users/${uid}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});
  if(!res||res.detail){flash(res?.detail||'Error',false);screenTeam();return;}
  flash('Role updated.');
}

async function deactivateUser(uid,name) {
  if(!confirm(`Deactivate ${name}?`))return;
  await api(`/api/admin/users/${uid}`,{method:'DELETE'});
  flash(`${name} deactivated.`); screenTeam();
}

async function activateUser(uid) {
  await api(`/api/admin/users/${uid}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:true})});
  flash('User reactivated.'); screenTeam();
}

function openResetModal(uid,name) {
  _resetUid=uid; document.getElementById('reset-for').textContent=name;
  document.getElementById('reset-pw').value='';
  document.getElementById('reset-modal').classList.add('open');
}
function closeResetModal() { document.getElementById('reset-modal').classList.remove('open'); }
async function doReset() {
  const pw=document.getElementById('reset-pw').value;
  if(!pw||pw.length<6){flash('Minimum 6 characters.',false);return;}
  const res=await api(`/api/admin/users/${_resetUid}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:pw})});
  if(res?.ok){flash('Password reset.');closeResetModal();}else{flash(res?.detail||'Error',false);}
}

// ── SCREEN: Analytics ────────────────────────────────────────────────────────
function screenAnalytics() {
  setTitle('Analytics');
  screenReports(); // reuse the reports screen for now
}

// ── SCREEN: Profiles to review (hiring_manager) ───────────────────────────────
async function screenProfiles() {
  setTitle('Profiles to review');
  const rows = await api('/api/profiles-to-review');
  if (!rows) return;

  if (!rows.length) {
    document.getElementById('content').innerHTML = `
      <div class="page-header"><h1>Profiles to review</h1></div>
      <div class="card"><p class="empty">No profiles pending your review.</p>
      <p class="hint" style="text-align:center;margin-top:8px">Profiles appear here when a requisition lists you as hiring manager and a candidate reaches "Selected" stage.</p>
      </div>`;
    return;
  }

  const cards = rows.map(r => `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">
        <div style="flex:1">
          <div style="font-size:16px;font-weight:600;margin-bottom:4px">${r.full_name}</div>
          <div style="font-size:13px;color:var(--muted)">${r.email} · ${r.gender||'—'}</div>
          <div style="font-size:13px;margin-top:6px">Requisition: <strong>${r.req_title}</strong></div>
          <div style="margin-top:8px">
            <span style="font-size:20px;font-weight:700;color:var(--accent)">${r.combined_score!=null?Math.round(r.combined_score):r.match_score!=null?Math.round(r.match_score):'—'}</span>
            <span style="font-size:12px;color:var(--muted)"> / 100 score</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;min-width:180px">
          <input id="hm-comment-${r.id}" placeholder="Optional comment…" style="padding:7px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;width:100%">
          <button class="btn btn-primary btn-sm" onclick="hmFeedback('${r.id}',true)">✓ Approve</button>
          <button class="btn btn-danger btn-sm" onclick="hmFeedback('${r.id}',false)">✗ Not approved</button>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="page-header"><h1>Profiles to review</h1></div>
    ${cards}`;
}

async function hmFeedback(appId, approved) {
  const comment = document.getElementById(`hm-comment-${appId}`)?.value.trim();
  const res = await api(`/api/applications/${appId}/hm-feedback`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approved, comment }),
  });
  if (res) { flash(approved ? 'Approved.' : 'Feedback submitted.'); screenProfiles(); }
}

// ── New Requisition form ──────────────────────────────────────────────────────
let _roundCount = 0;

async function openReqModal() {
  _roundCount = 0;
  document.getElementById('rounds-list').innerHTML = '';
  ['rf-title','rf-fy','rf-skills','rf-jd'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('rf-openings').value='1';
  ['rf-exp','rf-ctc'].forEach(id=>document.getElementById(id).value='');

  const [bus, bands] = await Promise.all([api('/api/business-units'), api('/api/bands')]);
  document.getElementById('rf-bu').innerHTML   = (bus  ||[]).map(b=>`<option value="${b.id}">${b.name} (${b.company})</option>`).join('');
  document.getElementById('rf-band').innerHTML = (bands||[]).filter(b=>b.is_active).map(b=>`<option value="${b.id}">${b.code} — ${b.description}</option>`).join('');

  // Default: AI screening + 2 panel levels
  addRound('AI screening interview', 'bot_interview', true);
  addRound('Technical panel', 'panel', false);

  document.getElementById('req-modal').classList.add('open');
}

function closeReqModal() { document.getElementById('req-modal').classList.remove('open'); }

function addRound(name='', type='panel', isAuto=false) {
  _roundCount++;
  const seq = _roundCount;
  const el = document.createElement('div');
  el.style.cssText='display:flex;gap:8px;align-items:center';
  el.innerHTML = `
    <span style="font-size:12px;color:var(--muted);min-width:20px">${seq}.</span>
    <input data-round="name" placeholder="Round name e.g. Level 1 Panel" value="${name}" style="flex:2;padding:7px 9px;border:1px solid var(--border);border-radius:4px;font-size:13px">
    <select data-round="type" style="padding:7px 9px;border:1px solid var(--border);border-radius:4px;font-size:13px">
      <option value="panel"${type==='panel'?' selected':''}>Panel</option>
      <option value="bot_interview"${type==='bot_interview'?' selected':''}>AI / Bot</option>
      <option value="hr"${type==='hr'?' selected':''}>HR</option>
      <option value="assessment"${type==='assessment'?' selected':''}>Assessment</option>
    </select>
    <select data-round="auto" style="padding:7px 9px;border:1px solid var(--border);border-radius:4px;font-size:13px">
      <option value="false"${!isAuto?' selected':''}>Manual</option>
      <option value="true"${isAuto?' selected':''}>Auto</option>
    </select>
    <button type="button" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px" onclick="this.parentElement.remove()">×</button>`;
  el.dataset.seq = seq;
  document.getElementById('rounds-list').appendChild(el);
}

async function submitReq() {
  const title = document.getElementById('rf-title').value.trim();
  if (!title) { flash('Job title is required.', false); return; }
  const skillsRaw = document.getElementById('rf-skills').value;
  const skills = skillsRaw.split(',').map(s=>s.trim()).filter(Boolean);

  // Collect rounds
  const roundEls = document.querySelectorAll('#rounds-list > div');
  const rounds = [];
  roundEls.forEach((el, i) => {
    const name = el.querySelector('[data-round="name"]')?.value.trim();
    if (!name) return;
    rounds.push({
      sequence: i+1,
      name,
      round_type: el.querySelector('[data-round="type"]')?.value || 'panel',
      is_auto:    el.querySelector('[data-round="auto"]')?.value === 'true',
    });
  });

  const body = {
    title,
    bu_id:          document.getElementById('rf-bu').value,
    band_id:        document.getElementById('rf-band').value,
    roll_type:      document.getElementById('rf-roll').value,
    openings:       parseInt(document.getElementById('rf-openings').value)||1,
    fiscal_year:    document.getElementById('rf-fy').value.trim()||null,
    min_experience: parseFloat(document.getElementById('rf-exp').value)||null,
    budgeted_ctc:   parseFloat(document.getElementById('rf-ctc').value)||null,
    key_skills:     skills,
    job_description:document.getElementById('rf-jd').value.trim()||null,
    rounds,
  };

  const res = await api('/api/requisitions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res || res.detail || res.error) { flash(res?.detail||res?.error||'Error creating requisition', false); return; }
  flash(`Requisition "${title}" created.`);
  closeReqModal();
  screenRequisitions();
}

// ── Apply modal ───────────────────────────────────────────────────────────────
let _applyMode = 'file';

async function openApplyModal(reqId) {
  document.getElementById('am-result').style.display='none';
  document.getElementById('am-result').innerHTML='';
  ['am-name','am-email','am-years'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('am-file').value='';
  document.getElementById('am-text').value='';

  const reqs = await api('/api/requisitions');
  document.getElementById('am-req').innerHTML = (reqs||[]).map(r=>
    `<option value="${r.id}"${r.id===reqId?' selected':''}>${r.title} — ${r.business_unit}</option>`
  ).join('');
  setApplyMode('file');
  document.getElementById('apply-modal').classList.add('open');
}

function closeApplyModal() { document.getElementById('apply-modal').classList.remove('open'); }

function setApplyMode(mode) {
  _applyMode = mode;
  document.getElementById('am-tab-file').classList.toggle('active', mode==='file');
  document.getElementById('am-tab-text').classList.toggle('active', mode==='text');
  document.getElementById('am-file-area').style.display = mode==='file'?'':'none';
  document.getElementById('am-text-area').style.display = mode==='text'?'':'none';
}

async function submitApply() {
  const btn=document.getElementById('am-submit-btn');
  btn.disabled=true; btn.textContent='Screening…';
  const resEl=document.getElementById('am-result');
  resEl.style.display='none';

  try {
    const reqId=document.getElementById('am-req').value;
    const name=document.getElementById('am-name').value||'Unnamed';
    const email=document.getElementById('am-email').value||'x@x.com';
    const gender=document.getElementById('am-gender').value;
    const years=document.getElementById('am-years').value;

    let res;
    if (_applyMode === 'file') {
      const file=document.getElementById('am-file').files[0];
      if(!file){flash('Select a file first.',false);return;}
      const fd=new FormData();
      fd.append('requisition_id',reqId); fd.append('full_name',name);
      fd.append('email',email); fd.append('gender',gender);
      if(years) fd.append('years_experience',years);
      fd.append('file',file);
      res = await api('/api/apply/upload',{method:'POST',body:fd});
    } else {
      res = await api('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requisition_id:reqId,full_name:name,email,gender,years_experience:parseFloat(years)||null,resume_text:document.getElementById('am-text').value})});
    }
    if (!res) return;
    if (res.detail||res.error){flash(res.detail||res.error,false);return;}
    const b=res.breakdown||{};
    resEl.innerHTML=`
      <span class="score-big">${res.match_score}</span><span style="font-size:13px;color:var(--muted)"> / 100</span>
      <div style="margin-top:8px;font-size:13px">
        Skills matched: <strong>${b.skills_matched_count??'—'} / ${b.skills_total??'—'}</strong><br>
        Matched: ${(b.matched_skills||[]).join(', ')||'—'}<br>
        Missing: ${(b.missing_skills||[]).join(', ')||'—'}
      </div>
      ${res.warning?`<p style="color:var(--gold);font-size:12px;margin-top:6px">⚠ ${res.warning}</p>`:''}
      ${res.resume_preview?`<details style="margin-top:8px;font-size:12px"><summary style="cursor:pointer;color:var(--muted)">Resume preview</summary><pre style="white-space:pre-wrap;font-size:11px;margin-top:4px;background:#f4f1ea;padding:8px;border-radius:3px">${res.resume_preview.replace(/</g,'&lt;')}…</pre></details>`:''}`;
    resEl.style.display='block';
  } finally {
    btn.disabled=false; btn.textContent='Submit & screen';
  }
}

// ── Change own password ───────────────────────────────────────────────────────
document.getElementById('topbar-avatar').addEventListener('contextmenu', e => {
  e.preventDefault();
  document.getElementById('chpw-modal').classList.add('open');
  document.getElementById('chpw-old').value=''; document.getElementById('chpw-new').value='';
  document.getElementById('chpw-err').style.display='none';
});

async function doChpw() {
  const op=document.getElementById('chpw-old').value, np=document.getElementById('chpw-new').value;
  const errEl=document.getElementById('chpw-err');
  errEl.style.display='none';
  if(!op||!np){errEl.textContent='Fill in both fields.';errEl.style.display='block';return;}
  const res=await api('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:op,new_password:np})});
  if(res?.ok){flash('Password changed. Signing you out…'); document.getElementById('chpw-modal').classList.remove('open'); setTimeout(logout,2000);}
  else{errEl.textContent=res?.detail||'Error';errEl.style.display='block';}
}

const _qs = new URLSearchParams(window.location.search);
if (_qs.get('connected')==='1') { history.replaceState({},'','/'); flash('Google Calendar connected.'); }
if (_qs.get('gcal_error'))      { history.replaceState({},'','/'); flash('GCal error: '+_qs.get('gcal_error'), false); }

// ── 15-minute inactivity timeout ─────────────────────────────────────────────
const INACTIVITY_MS = 15 * 60 * 1000; // 15 minutes
let _idleTimer;
function _resetIdle() {
  clearTimeout(_idleTimer);
  _idleTimer = setTimeout(() => {
    flash('Session timed out after 15 minutes of inactivity. Signing out…', false);
    setTimeout(logout, 2000);
  }, INACTIVITY_MS);
}
['mousemove','keydown','mousedown','touchstart','scroll','click'].forEach(ev =>
  document.addEventListener(ev, _resetIdle, { passive: true })
);
_resetIdle(); // start timer on page load

// ── Boot ──────────────────────────────────────────────────────────────────────
(function boot() {
  try {
    buildNav();
  } catch (e) {
    document.getElementById('sidenav').innerHTML =
      `<div style="color:#f87171;padding:16px;font-size:12px">Nav error: ${e.message}</div>`;
    console.error('buildNav failed:', e);
  }

  refreshGCalStatus().catch(e => console.warn('GCal status:', e));

  const hashParts = (location.hash || '#dashboard').split(/[#\/]/);
  const initId    = hashParts[1] || 'dashboard';
  const initParam = hashParts[2];

  try {
    runRoute(initId, initParam);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="card" style="padding:40px;text-align:center">
        <p style="font-weight:600;margin-bottom:8px">Startup error</p>
        <p style="color:var(--muted);font-size:13px;margin-bottom:16px">${e.message}</p>
        <button class="btn btn-primary" onclick="location.reload()">Reload page</button>
        <button class="btn btn-ghost" style="margin-left:8px" onclick="logout()">Sign out</button>
      </div>`;
    console.error('runRoute failed:', e);
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f15a22">
<title>Egnex — Set Password</title>
<style>
  :root {
    --ink: #1a1d24; --paper: #f4f1ea; --card: #ffffff;
    --line: #d8d3c7; --accent: #f15a22; --muted: #6b6760;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .box {
    background: var(--card); width: 100%; max-width: 500px;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .box-top {
    padding: 44px 48px 32px; text-align: center;
    border-bottom: 4px solid var(--accent);
  }
  .logo { height: 100px; width: auto; margin-bottom: 14px; border-radius: 14px; }
  .tagline { font-size: 13px; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; }
  .box-body { padding: 40px 48px 48px; }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 20px; }
  .msg-box {
    font-size: 15px; padding: 12px 16px; border-radius: 4px; margin-bottom: 18px;
  }
  .msg-box.error { background: #fde8e4; border: 1px solid #f5b8ae; color: #8b2a1a; }
  .msg-box.success { background: #e4f7ea; border: 1px solid #a8dbb5; color: #1a5c2a; }
  label {
    display: block; font-size: 13px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin: 18px 0 6px;
  }
  input {
    width: 100%; padding: 13px 15px; border: 1px solid var(--line);
    border-radius: 4px; font-family: inherit; font-size: 17px;
    background: #fbfaf7; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; margin-top: 28px; padding: 16px; background: var(--accent);
    color: #fff; border: none; border-radius: 4px; font-family: inherit;
    font-size: 18px; cursor: pointer; letter-spacing: 0.4px; transition: background 0.15s;
  }
  .btn:hover { background: #c94918; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  @media (max-width: 540px) {
    body { align-items: flex-start; padding: env(safe-area-inset-top, 0) 0 0; }
    .box { max-width: 100%; border-radius: 0; border-left: none; border-right: none; box-shadow: none; min-height: 100vh; }
    .box-top { padding: 32px 28px 24px; }
    .box-body { padding: 28px 28px 40px; }
    .logo { height: 72px; }
    h1 { font-size: 24px; }
  }
  @media screen and (-webkit-min-device-pixel-ratio: 0) { input { font-size: 17px; } }
  button { touch-action: manipulation; -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<div class="box">
  <div class="box-top">
    <img src="/assets/egnex-logo.png" alt="Egnex" class="logo">
    <div class="tagline">Embrace Generations to Next</div>
  </div>
  <div class="box-body">
    <h1 id="page-title">Set your password</h1>
    <div id="msg" class="msg-box" style="display:none"></div>
    <div id="form-wrap">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password">
      <button class="btn" id="btn" onclick="doSetPassword()">Set password</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get('token') || '';

if (!token) {
  showMsg('error', 'Invalid or missing link. Request a new one.');
  document.getElementById('form-wrap').style.display = 'none';
} else {
  // Validate token on load
  fetch('/api/auth/reset-token/validate?token=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(data => {
      if (!data.valid) {
        showMsg('error', 'This link has expired or already been used. Request a new password reset.');
        document.getElementById('form-wrap').style.display = 'none';
      }
    })
    .catch(() => {});
}

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'msg-box ' + type;
  el.textContent = text;
  el.style.display = 'block';
}

document.getElementById('pw2').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSetPassword();
});

async function doSetPassword() {
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const btn = document.getElementById('btn');

  if (pw.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
  if (pw !== pw2)    { showMsg('error', 'Passwords do not match.'); return; }

  btn.disabled = true; btn.textContent = 'Setting password…';
  try {
    const res  = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg('error', data.detail || 'Could not set password. The link may have expired.');
      return;
    }
    showMsg('success', 'Password set! Redirecting to sign in…');
    document.getElementById('form-wrap').style.display = 'none';
    setTimeout(() => window.location.replace('/login'), 1800);
  } catch {
    showMsg('error', 'Could not reach the server. Is the backend running?');
  } finally {
    btn.disabled = false; btn.textContent = 'Set password';
  }
}
</script>
</body>
</html>
